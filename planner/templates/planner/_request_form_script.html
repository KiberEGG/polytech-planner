{{ events|json_script:"events-data" }}
{{ school_classes|json_script:"school-classes-data" }}
<script>
(function () {
  const events = JSON.parse(document.getElementById("events-data").textContent);
  const schoolClasses = JSON.parse(document.getElementById("school-classes-data").textContent);
  const eventBlock = document.getElementById("event-block");
  const mcBlock = document.getElementById("mc-block");
  const eventSelect = document.getElementById("id_event");
  const eventInfo = document.getElementById("event-info");
  const eventMcInputs = document.querySelectorAll("#field-event_master_classes input[type=checkbox]");
  const posted = {{ form.is_bound|yesno:"true,false" }};

  function kind() {
    const checked = document.querySelector("input[name=kind]:checked");
    return checked ? checked.value : "event";
  }
  function updateKind() {
    eventBlock.classList.toggle("hidden", kind() !== "event");
    mcBlock.classList.toggle("hidden", kind() === "event");
  }
  function updateEvent(resetChecks) {
    const ev = events[eventSelect.value];
    eventInfo.textContent = ev ? `Дата: ${ev.date}, время: ${ev.time}` : "";
    eventMcInputs.forEach((input) => {
      const inEvent = ev && ev.master_classes.includes(Number(input.value));
      input.closest("div").classList.toggle("hidden", !inEvent);
      if (!inEvent) input.checked = false;
      else if (resetChecks) input.checked = true;
    });
  }
  const schoolSelect = document.getElementById("id_school");
  const classesInput = document.getElementById("id_classes_text");
  const classesList = document.getElementById("classes-list");
  classesInput.setAttribute("list", "classes-list");
  function updateSchool() {
    document.getElementById("school-name-block").classList.toggle("hidden", !!schoolSelect.value);
    classesList.innerHTML = "";
    (schoolClasses[schoolSelect.value] || []).forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      classesList.appendChild(opt);
    });
  }
  document.querySelectorAll("input[name=kind]").forEach((el) => el.addEventListener("change", updateKind));
  eventSelect.addEventListener("change", () => updateEvent(true));
  schoolSelect.addEventListener("change", updateSchool);
  updateKind();
  updateEvent(!posted);
  updateSchool();
})();
</script>
